<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Matrabhāsha workflow</text>
  <g stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="150" y1="110" x2="150" y2="160"/>
    <line x1="150" y1="230" x2="150" y2="280"/>
    <line x1="150" y1="360" x2="150" y2="410"/>
    <line x1="235" y1="450" x2="335" y2="450"/>
    <line x1="545" y1="450" x2="625" y2="450"/>
    <path d="M720,410 L720,330 L545,330"/>
    <path d="M810,450 L840,450 L840,250 L800,250"/>
    <line x1="720" y1="210" x2="720" y2="150"/>
    <path d="M65,195 L30,195 L30,80 L60,80"/>
  </g>
  <!-- input -->
  <rect x="60" y="55" width="180" height="55" rx="10" fill="#e8f0fe" stroke="#4a6fd1"/>
  <text x="150" y="78" text-anchor="middle">Student types</text>
  <text x="150" y="97" text-anchor="middle" font-size="12">Concept + Level</text>
  <!-- validate -->
  <polygon points="150,160 235,195 150,230 65,195" fill="#fff4e0" stroke="#d18a1a"/>
  <text x="150" y="192" text-anchor="middle" font-size="12">Valid concept</text>
  <text x="150" y="207" text-anchor="middle" font-size="12">and level?</text>
  <text x="38" y="135" font-size="11" fill="#a33">No:</text><text x="38" y="149" font-size="11" fill="#a33">ask again</text>
  <text x="158" y="255" font-size="11" fill="#2a7">Yes</text>
  <!-- explainer -->
  <rect x="45" y="280" width="210" height="80" rx="10" fill="#e6f6ec" stroke="#2a8a4a"/>
  <text x="150" y="303" text-anchor="middle" font-weight="bold">Explainer prompt</text>
  <text x="150" y="322" text-anchor="middle" font-size="12">latest version (v1 → v2 → v3)</text>
  <text x="150" y="339" text-anchor="middle" font-size="12">role, level, Hindi + term rules</text>
  <!-- draft -->
  <rect x="65" y="410" width="170" height="80" rx="10" fill="#f3f3f3" stroke="#777"/>
  <text x="150" y="445" text-anchor="middle">Draft answer</text>
  <text x="150" y="464" text-anchor="middle" font-size="12">5 sections (from v2)</text>
  <!-- reviewer -->
  <rect x="335" y="410" width="210" height="80" rx="10" fill="#f1e8fb" stroke="#7a4ac1"/>
  <text x="440" y="438" text-anchor="middle" font-weight="bold">Reviewer prompt (from v2)</text>
  <text x="440" y="457" text-anchor="middle" font-size="12">separate chat, rules R1–R6</text>
  <text x="440" y="474" text-anchor="middle" font-size="12">JSON scores + errors</text>
  <!-- verdict -->
  <polygon points="720,410 810,450 720,490 630,450" fill="#fff4e0" stroke="#d18a1a"/>
  <text x="720" y="455" text-anchor="middle">Verdict?</text>
  <!-- revise -->
  <rect x="345" y="295" width="200" height="60" rx="10" fill="#fdeaea" stroke="#c14a4a"/>
  <text x="445" y="320" text-anchor="middle">REVISE: send errors back</text>
  <text x="445" y="339" text-anchor="middle" font-size="12">explainer rewrites once</text>
  <line x1="345" y1="340" x2="240" y2="430" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="600" y="322" font-size="11" fill="#a33">REVISE</text>
  <!-- human -->
  <rect x="630" y="210" width="180" height="60" rx="10" fill="#fff8d6" stroke="#b39a1a"/>
  <text x="720" y="236" text-anchor="middle" font-weight="bold">Human check</text>
  <text x="720" y="255" text-anchor="middle" font-size="12">team verifies accuracy</text>
  <text x="846" y="350" font-size="11" fill="#2a7">PASS</text>
  <!-- final -->
  <rect x="620" y="90" width="200" height="60" rx="10" fill="#e8f0fe" stroke="#4a6fd1"/>
  <text x="720" y="115" text-anchor="middle" font-weight="bold">Final Hindi explanation</text>
  <text x="720" y="134" text-anchor="middle" font-size="12">shown to the student</text>
</svg>
